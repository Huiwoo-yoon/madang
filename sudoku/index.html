<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스도쿠</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="../mini.css?v=20261002d">
</head>
<body>

<header>
  <div class="who"><span id="hChar"></span> <span id="hName"></span> <button id="homeBtn" class="btn tiny">🏠 마당으로</button></div>
  <div class="stat">💰 <b id="hPoints">0</b> 포인트</div>
</header>

<main>
  <section id="menu">
    <h1>🔢 오늘의 스도쿠</h1>
    <p class="hint">하루에 한 번만 할 수 있어요. 어려운 판일수록 포인트를 많이 받아요. 힌트를 쓰면 한 번에 10%씩 줄어요.</p>
    <p id="doneNote" class="done-note" hidden>✅ 오늘의 스도쿠는 이미 풀었어요. 내일 또 만나요!</p>
    <div id="levels" class="picks"></div>
  </section>

  <section id="play" hidden>
    <div class="tools"><button type="button" id="btn-back" class="btn">← 난이도 고르기</button></div>
    <h2 id="title"></h2>
    <table id="board"></table>

    <div id="numpad"></div>
    <div class="tools">
      <button type="button" id="btn-erase" class="btn">지우기</button>
      <button type="button" id="btn-notes" class="btn" aria-pressed="false">✏️ 메모</button>
      <button type="button" id="btn-undo" class="btn">되돌리기</button>
      <button type="button" id="btn-hint" class="btn">💡 힌트</button>
      <button type="button" id="btn-autonotes" class="btn">메모 자동 채우기</button>
      <button type="button" id="btn-check" class="btn">채점</button>
      <button type="button" id="btn-reset" class="btn">다시 하기</button>
    </div>
    <div id="cheer"></div>
    <p id="message" class="msg"></p>
    <button type="button" id="retryBtn" class="btn primary" hidden>포인트 다시 받기</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js?v=20261002d"></script>
<script src="../api.js?v=20261002d"></script>
<script src="../pixel.js?v=20261002d"></script>
<script src="../mini.js?v=20261002d"></script>
<script src="puzzles.js?v=20261002d"></script>
<script src="engine.js?v=20261002d"></script>
<script src="app.js?v=20261002d"></script>
</body>
</html>
